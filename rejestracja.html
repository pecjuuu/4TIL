<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header id="baner">
        <h1>Formularz rejestracyjny konferencji <em><strong>Nasze Kwiaty</strong></em></h1>
    </header>
    <main id="główny">
        <section id="blok1">
            <h2>Dane osobowe</h2>
            <input type="text" value="Wpisz imię..."><br>
            <input type="text" value="Wpisz nazwisko..."><br>
            <button>Następna karta</button>
        </section>
        <section id="blok2">
            <h2>Dane kontaktowe</h2>
            <input type="email" value="Twój e-mail..."><br>
            <input type="tel" value="Twój numer telefonu..."><br>
            <button>Następna karta</button>
        </section>
        <section id="blok3">
            <h2>Hasło do logowania</h2>
            <input type="password" value="Podaj hasło"><br>
            <input type="password" value="Powtórz hasło"><br>
            <button>Zatwierdź</button>
        </section>
    </main>
    <footer>
        <section id="stopka1">
            <video width="320" height="240" controls>
                <source src="motyl.mp4" type="video/mp4">Przeglądarka nie obsługuje tego formatu</video>
        </section>
        <section id="stopka2">
            <h3>Plan konferencji</h3>
            <table>
                <tr>
                    <td>9:00 - 12:00</td>
                    <td>Pielęgnacja roślin</td>
                </tr>
                <tr>
                    <td>13:00 - 15:00</td>
                    <td>Targi kwiatowe</td>
                </tr>
            </table>
        </section>
        <section id="stopka3">
            <p><a href="https://kwiaty.pl/">Internetowa kwiaciarnia</a></p>
        </section>
        <section id="stopka4">
            <p>Formularz wykonał: 24</p>
        </section>
    </footer>








</body>
</html>
